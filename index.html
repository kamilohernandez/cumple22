<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cena de cumpleaños · Kamilo, 22 años</title>
<meta name="description" content="Sábado 12 de diciembre, 6:30 p. m. · Restaurante Don Cándido, Los Robles, Managua.">
<meta name="robots" content="noindex, nofollow">

<meta property="og:type" content="website">
<meta property="og:title" content="Cena de cumpleaños · Kamilo, 22 años">
<meta property="og:description" content="Sábado 12 de diciembre, 6:30 p. m. · Don Cándido, Los Robles">
<meta property="og:image" content="https://kamilohernandez.github.io/cumple22/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="preload" as="image" href="img/pergamino-top.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #3A2210; --ink-soft: #6B4A2B; --ink-title: #2B170A;
    --gold: linear-gradient(100deg, #5E3D14 0%, #96682F 18%, #D2A654 34%, #A87735 50%, #E0BC6C 64%, #8A5E2A 82%, #5E3D14 100%);
    --sheet: min(520px, calc(100vw - 24px));
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; background: #120B06; }
  body {
    margin: 0; min-height: 100vh; min-height: 100dvh; color: var(--ink); overflow-x: hidden;
    font: 400 19px/1.45 "IM Fell English", Georgia, serif;
  }
  body::before { /* fixed backdrop (iOS ignores background-attachment: fixed) */
    content: ""; position: fixed; inset: 0; z-index: -2;
    background: #120B06 url("img/fondo.webp") center top / cover no-repeat;
  }
  .luz { /* candlelight flicker */
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(ellipse 70% 45% at 50% 18%, rgba(255, 170, 70, .16), transparent 70%);
    animation: flicker 5.5s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: .85; } 12% { opacity: 1; } 18% { opacity: .78; } 33% { opacity: .95; }
    47% { opacity: .82; } 61% { opacity: 1; } 70% { opacity: .88; } 84% { opacity: .97; }
  }
  #brasas { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }

  main { position: relative; z-index: 1; padding: calc(34px + env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom)); }
  .sheet { position: relative; width: var(--sheet); margin: 0 auto; }
  .unroll { position: relative; }
  .paper { position: absolute; inset: 0; display: flex; flex-direction: column; pointer-events: none; }
  .p-top, .p-bot { flex: none; aspect-ratio: 1040 / 400; position: relative; z-index: 1; background: url("img/pergamino-top.webp") 0 0 / 100% 100% no-repeat; }
  .p-bot { background-image: url("img/pergamino-bot.webp"); }
  .p-mid { flex: 1 1 auto; margin: -1px 0; background: url("img/pergamino-mid.webp") 0 0 / 100% auto; background-repeat: no-repeat round; }
  .rod {
    position: absolute; left: -1.923%; width: 103.846%; aspect-ratio: 1080 / 90; z-index: 5;
    background: url("img/rodillo.webp") 0 0 / 100% 100% no-repeat; filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .55));
  }
  .rod-top { top: -3.6%; top: calc(var(--sheet) * -0.045); }
  .js .unroll { clip-path: inset(0 0 100% 0); }
  body.rm .unroll, body.fin .unroll { clip-path: none; }
  .rod-bot { bottom: calc(var(--sheet) * -0.045); }

  .esq { position: absolute; width: 38%; height: auto; z-index: 2; mix-blend-mode: multiply; pointer-events: none; }
  .esq-tl { top: 3.2%; top: calc(var(--sheet) * .035); left: 3.5%; }
  .esq-br { bottom: calc(var(--sheet) * .035); right: 3.5%; rotate: 180deg; }

  .content {
    position: relative; z-index: 3; text-align: center;
    padding: calc(var(--sheet) * .25) 11% calc(var(--sheet) * .25);
  }
  .content p { margin: 0; }
  .titulo {
    margin: 0; font: 400 clamp(52px, 15vw, 72px)/1 "UnifrakturMaguntia", serif; color: var(--ink-title);
    text-shadow: 0 0 1px rgba(43, 23, 10, .35), 0 1px 0 rgba(255, 240, 200, .25);
  }
  .divisor { display: block; width: 62%; max-width: 260px; height: auto; margin: 12px auto 4px; mix-blend-mode: multiply; }
  .divisor.chico { width: 46%; margin: 18px auto 16px; }
  .dibujo { position: relative; width: 74%; margin: 6px auto 0; aspect-ratio: 768 / 1200; }
  .dibujo img { position: absolute; inset: 0; width: 100%; height: 100%; mix-blend-mode: multiply; }
  .dibujo .trazo { opacity: .55; filter: blur(.4px); }
  .eyebrow { font: 400 15px/1.3 "IM Fell English SC", serif; letter-spacing: .24em; color: var(--ink-soft); margin-bottom: 4px !important; }
  .invitado { position: relative; margin: 18px 0 2px !important; }
  .mensaje { font-size: 21px; font-style: italic; color: var(--ink); }
  .hora { font-style: italic; color: var(--ink); }
  .nombre {
    /* generous padding (cancelled by negative margins) so the gold also paints the tall loops and long tails */
    display: inline-block; padding: .34em .34em .3em; margin: -.26em -.26em -.22em; font: 400 clamp(46px, 13vw, 64px)/1.12 "Pinyon Script", cursive;
    background: var(--gold); background-size: 260% 100%; background-position: 100% 0;
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: #A7783C;
    filter: drop-shadow(0 1px 0 rgba(70, 40, 10, .45)); text-wrap: balance; overflow-wrap: anywhere;
  }
  .nombre.largo { font-size: clamp(38px, 10.5vw, 52px); }
  .nombre.muy-largo { font-size: clamp(32px, 8.8vw, 44px); }
  .chispa { position: absolute; width: 14px; height: 14px; pointer-events: none; opacity: 0; }
  .chispa::before, .chispa::after { content: ""; position: absolute; left: 50%; top: 50%; background: #FFF3C8; border-radius: 2px; box-shadow: 0 0 6px 1px rgba(255, 214, 120, .9); }
  .chispa::before { width: 2px; height: 14px; transform: translate(-50%, -50%); }
  .chispa::after { width: 14px; height: 2px; transform: translate(-50%, -50%); }
  .fecha { font: 400 21px/1.35 "IM Fell English SC", serif; letter-spacing: .08em; color: var(--ink-title); margin: 2px 0 !important; }
  .logo { position: relative; width: 52%; max-width: 210px; margin: 14px auto 6px; }
  .logo img { display: block; width: 100%; height: auto; mix-blend-mode: multiply; }
  .logo .marca { display: none; font: 400 30px/1 "IM Fell English SC", serif; letter-spacing: .12em; color: var(--ink-title); }
  .logo .marca small { display: block; font-size: 13px; letter-spacing: .32em; margin-top: 6px; color: var(--ink-soft); }
  .logo.sin-logo img { display: none; }
  .logo.sin-logo .marca { display: block; }
  .lugar { font-size: 17px; color: var(--ink-soft); }
  .confirmar { position: relative; margin: 22px auto 0; }
  .sello {
    position: relative; display: block; width: 136px; height: 136px; margin: 0 auto; padding: 0; border: 0; background: none;
    cursor: pointer; -webkit-tap-highlight-color: transparent; border-radius: 50%;
  }
  .sello img { position: absolute; inset: 0; width: 100%; height: 100%; transition: opacity .45s ease, transform .45s ease; }
  .sello .s-ok { opacity: 0; transform: rotate(-25deg) scale(.9); }
  .sello::after { /* soft glow inviting the tap */
    content: ""; position: absolute; inset: -14px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(255, 196, 110, .55), rgba(255, 196, 110, 0) 65%); opacity: 0;
  }
  .sello:focus-visible { outline: 2px solid #8A5A22; outline-offset: 6px; }
  .sello-txt { font: 400 16px/1.3 "IM Fell English SC", serif; letter-spacing: .16em; color: var(--ink-title); margin-top: 10px !important; }
  .estado { font-size: 15px; font-style: italic; color: var(--ink-soft); min-height: 1.4em; margin-top: 4px !important; }
  .sin-link { display: none; font-size: 17px; font-style: italic; color: var(--ink-soft); margin-top: 22px !important; }
  .cierre { font: 400 clamp(40px, 11vw, 50px)/1.1 "Pinyon Script", cursive; color: var(--ink-soft); margin-top: 16px !important; }

  /* confirmed */
  body.confirmado .sello .s-ok { opacity: 1; transform: none; }
  body.confirmado .sello .s-base { opacity: 0; transform: rotate(20deg) scale(.9); }
  body.confirmado .sello::after { animation: none !important; opacity: 0; }
  body.confirmado .sello { cursor: default; }
  body.sin-nombre .confirmar { display: none; }
  body.sin-nombre .sin-link { display: block; }
  body.sin-nombre .invitado { display: none; }
  body.sin-nombre .mensaje::first-letter { text-transform: uppercase; }

  /* ---------- choreography: hidden until .on ---------- */
  .js .a { opacity: 0; }
  .js .a.on { opacity: 1; }
  .js .ink.on { animation: ink 1.25s cubic-bezier(.4, 0, .2, 1) both; }
  @keyframes ink {
    from { -webkit-mask-position: 100% 0; mask-position: 100% 0; filter: blur(3px); opacity: .2; }
    60% { filter: blur(.6px); opacity: 1; }
    to { -webkit-mask-position: 0 0; mask-position: 0 0; filter: blur(0); opacity: 1; }
  }
  .js .ink { -webkit-mask-image: linear-gradient(90deg, #000 42%, transparent 58%); mask-image: linear-gradient(90deg, #000 42%, transparent 58%); -webkit-mask-size: 260% 100%; mask-size: 260% 100%; -webkit-mask-position: 0 0; mask-position: 0 0; }
  .js .rise.on { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); filter: blur(3px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .js .grow.on { animation: grow 1.6s cubic-bezier(.3, .6, .2, 1) both; }
  @keyframes grow { from { clip-path: circle(0% at 0 0); opacity: .2; } to { clip-path: circle(150% at 0 0); opacity: 1; } }
  .js .rule.on { animation: rule 1s cubic-bezier(.3, .7, .2, 1) both; }
  @keyframes rule { from { opacity: 0; transform: scaleX(.1); } to { opacity: 1; transform: none; } }
  .js .sketch .trazo, .js .sketch .final { opacity: 0; }
  .js .sketch.on .trazo { animation: sketch 2.4s cubic-bezier(.45, .1, .3, 1) both; }
  .js .sketch.on .final { animation: settle 1.4s ease-out 1.5s both; }
  .js .sketch .trazo { -webkit-mask-image: linear-gradient(180deg, #000 44%, transparent 56%); mask-image: linear-gradient(180deg, #000 44%, transparent 56%); -webkit-mask-size: 100% 300%; mask-size: 100% 300%; }
  @keyframes sketch { from { opacity: .55; -webkit-mask-position: 0 100%; mask-position: 0 100%; } to { opacity: .55; -webkit-mask-position: 0 0; mask-position: 0 0; } }
  @keyframes settle { from { opacity: 0; } to { opacity: 1; } }
  .js .foil.on { animation: foil 1.3s cubic-bezier(.3, .6, .2, 1) both; }
  @keyframes foil { from { opacity: 0; transform: scale(.94); filter: blur(4px); } to { opacity: 1; transform: none; filter: blur(0); } }
  .js .foil.on .nombre { animation: shimmer 2.6s ease-in-out .5s both, shimmer 3.2s ease-in-out 7s infinite alternate; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .js .foil.on .chispa { animation: twinkle 2.8s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: 0; transform: scale(.2) rotate(0); } 18% { opacity: 1; transform: scale(1) rotate(12deg); } 36% { opacity: 0; transform: scale(.3) rotate(24deg); } }
  .js .seal.on .sello { animation: drop 1s cubic-bezier(.3, 1.4, .5, 1) both; }
  @keyframes drop { from { opacity: 0; transform: translateY(-70px) scale(1.35) rotate(-14deg); } 70% { opacity: 1; } to { opacity: 1; transform: none; } }
  .js .seal.on .sello::after { animation: glow 2.4s ease-in-out 1.2s infinite; }
  @keyframes glow { 0%, 100% { opacity: 0; transform: scale(.9); } 50% { opacity: .9; transform: scale(1.05); } }
  .sello.press { animation: press .5s cubic-bezier(.3, 1.5, .5, 1) both !important; }
  @keyframes press { 0% { transform: scale(1); } 35% { transform: scale(.84); } 70% { transform: scale(1.07); } 100% { transform: scale(1); } }
  .flake { position: fixed; left: 0; top: 0; width: 7px; height: 7px; z-index: 20; pointer-events: none; border-radius: 1px; background: linear-gradient(135deg, #FFF0B8, #C9994F 60%, #8C6A2E); }

  /* tap during the intro, or reduced motion: everything in place, nothing moving */
  body.fin .a, body.rm .a { opacity: 1 !important; animation: none !important; transform: none !important; filter: none !important; clip-path: none !important; -webkit-mask-image: none !important; mask-image: none !important; }
  body.fin .sketch .trazo, body.rm .sketch .trazo { opacity: 0 !important; animation: none !important; }
  body.fin .sketch .final, body.rm .sketch .final { opacity: 1 !important; animation: none !important; }
  body.rm .luz { animation: none; }
  body.rm .chispa { display: none; }
  .js.fin .seal .sello, .js.fin .seal.on .sello { animation: none; }
  .js.fin .seal.on .sello::after { animation: glow 2.4s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce) { .luz { animation: none; } }
  @media (min-width: 700px) { main { padding-top: 64px; padding-bottom: 80px; } }
</style>
</head>
<body>
<script>document.documentElement.classList.add('js');</script>
<div class="luz" aria-hidden="true"></div>
<canvas id="brasas" aria-hidden="true"></canvas>

<main>
  <article class="sheet" id="hoja">
    <div class="rod rod-top" aria-hidden="true"></div>
    <div class="unroll" id="unroll">
      <div class="paper" aria-hidden="true"><i class="p-top"></i><i class="p-mid"></i><i class="p-bot"></i></div>
      <img class="esq esq-tl a grow" src="img/esquina.svg" alt="">
      <img class="esq esq-br a grow" src="img/esquina.svg" alt="">

      <div class="content">
        <p class="eyebrow a rise">Cena de cumpleaños</p>
        <h1 class="titulo a ink">Kamilo</h1>
        <img class="divisor a rule" src="img/divisor.svg" alt="">

        <div class="dibujo a sketch" role="img" aria-label="Retrato de Kamilo a lápiz">
          <img class="trazo" src="img/dibujo.webp" alt="">
          <img class="final" src="img/dibujo.webp" alt="">
        </div>

        <p class="invitado a foil">
          <span class="nombre js-nombre"></span>
          <i class="chispa" style="left:6%;top:12%;animation-delay:.2s"></i>
          <i class="chispa" style="right:8%;top:4%;animation-delay:1.1s"></i>
          <i class="chispa" style="left:2%;bottom:6%;animation-delay:1.9s"></i>
          <i class="chispa" style="right:2%;bottom:18%;animation-delay:.7s"></i>
        </p>
        <p class="mensaje a rise">te invito a celebrar mis 22 años.</p>

        <img class="divisor chico a rule" src="img/divisor.svg" alt="">

        <p class="fecha a rise">Sábado 12 de diciembre</p>
        <p class="hora a rise">6:30 de la tarde</p>
        <div class="logo a rise">
          <img src="img/don-candido.png" alt="Restaurante Don Cándido" onerror="this.parentNode.classList.add('sin-logo')">
          <span class="marca">Don Cándido<small>Restaurante</small></span>
        </div>
        <p class="lugar a rise">Los Robles, Managua</p>

        <div class="confirmar a seal">
          <button class="sello js-sello" type="button" aria-describedby="estado">
            <img class="s-base" src="img/sello.svg" alt="">
            <img class="s-ok" src="img/sello-confirmado.svg" alt="">
          </button>
          <p class="sello-txt js-sello-txt">Confirmar asistencia</p>
          <p class="estado js-estado" id="estado" aria-live="polite"></p>
        </div>
        <p class="sin-link">Pedile a Kamilo tu invitación personal para confirmar.</p>

        <p class="cierre a rise">¡Te espero!</p>
      </div>
    </div>
    <div class="rod rod-bot" aria-hidden="true"></div>
  </article>
</main>

<script>
  // URL de la aplicación web de Google Apps Script (Implementar > Aplicación web).
  const ENDPOINT = '';

  const q = new URLSearchParams(location.search);
  const nombre = (q.get('n') || '').replace(/\s+/g, ' ').trim().slice(0, 80);
  // Link previews (WhatsApp, Telegram, Facebook…) must never count as a confirmation.
  const esRobot = /bot|crawl|spider|preview|facebookexternalhit|whatsapp|telegram|slack|discord|skype|embedly/i.test(navigator.userAgent) || navigator.webdriver;
  const prueba = q.has('prueba') || !ENDPOINT || esRobot;
  const clave = 'cumple22:' + nombre.toLowerCase();
  const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = s => document.querySelector(s);
  const body = document.body;

  if (nombre) {
    $('.js-nombre').textContent = nombre;
    // Long names get a smaller size so they fit in one or two balanced lines instead of three.
    if (nombre.length > 24) $('.js-nombre').classList.add('muy-largo');
    else if (nombre.length > 14) $('.js-nombre').classList.add('largo');
  }
  else body.classList.add('sin-nombre');

  /* ---------- confirmation (contract shared with the Apps Script) ---------- */
  const yaConfirmo = () => { try { return localStorage.getItem(clave) === '1'; } catch (e) { return false; } };
  const recordar = () => { try { localStorage.setItem(clave, '1'); } catch (e) {} };
  const sello = $('.js-sello'), selloTxt = $('.js-sello-txt'), estado = $('.js-estado');
  let enviando = false;

  function marcarConfirmado(anim) {
    body.classList.add('confirmado');
    selloTxt.textContent = '¡Asistencia confirmada!';
    estado.textContent = prueba ? 'Vista de prueba: no se registró nada.' : '';
    sello.setAttribute('aria-label', 'Asistencia confirmada');
    if (anim) lluviaDorada();
  }

  async function enviar() {
    const datos = JSON.stringify({ nombre });
    try {
      const r = await fetch(ENDPOINT, { method: 'POST', body: datos });
      const j = await r.json();
      if (!j.ok) throw new Error(j.error || 'respuesta inválida');
    } catch (e) {
      // If the response could not be read (CORS on some browsers), send it once more without reading it;
      // the script updates the same row, so a repeat never duplicates the guest.
      await fetch(ENDPOINT, { method: 'POST', mode: 'no-cors', body: datos });
    }
  }

  sello.setAttribute('aria-label', 'Confirmar asistencia');
  sello.addEventListener('click', async () => {
    if (enviando || body.classList.contains('confirmado') || !nombre) return;
    enviando = true;
    sello.classList.remove('press'); void sello.offsetWidth; sello.classList.add('press');
    estado.textContent = '';
    try {
      if (!prueba) await enviar();
      else await new Promise(r => setTimeout(r, 450));
      if (!prueba) recordar();
      marcarConfirmado(true);
    } catch (e) {
      estado.textContent = 'No se pudo confirmar. Revisá tu conexión y tocá el sello de nuevo.';
    } finally {
      enviando = false;
    }
  });
  if (nombre && !prueba && yaConfirmo()) marcarConfirmado(false);

  function lluviaDorada() {
    if (reducido) return;
    const r = sello.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    for (let i = 0; i < 34; i++) {
      const f = document.createElement('i');
      f.className = 'flake';
      document.body.appendChild(f);
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 130, rot = (Math.random() - .5) * 720;
      const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 40;
      f.animate([
        { transform: `translate(${cx}px, ${cy}px) rotate(0) scale(${.6 + Math.random()})`, opacity: 1 },
        { transform: `translate(${cx + dx}px, ${cy + dy}px) rotate(${rot / 2}deg)`, opacity: 1, offset: .55 },
        { transform: `translate(${cx + dx * 1.15}px, ${cy + dy + 120}px) rotate(${rot}deg) scale(.4)`, opacity: 0 }
      ], { duration: 1300 + Math.random() * 700, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => f.remove();
    }
  }

  /* ---------- choreography ---------- */
  const piezas = [...document.querySelectorAll('.a')];
  const mostrar = (el, retraso = 0) => setTimeout(() => el.classList.add('on'), retraso);
  let introTerminada = false;

  function terminarIntro() {
    if (introTerminada) return;
    introTerminada = true;
    body.classList.add('fin');
    piezas.forEach(el => el.classList.add('on'));
    unrollAnims.forEach(a => a.finish());
    $('.rod-bot').style.transform = '';
  }

  let unrollAnims = [];
  // Closed scroll from the first paint: the bottom roller sits right under the top one.
  const cerrar = () => { $('.rod-bot').style.transform = `translateY(${-$('#unroll').offsetHeight}px)`; };
  if (!reducido) cerrar(); else body.classList.add('rm');
  function intro() {
    if (reducido) { piezas.forEach(el => el.classList.add('on')); return; }
    cerrar();
    const hoja = $('#unroll'), H = hoja.offsetHeight, vh = innerHeight;
    const dur = Math.max(1900, Math.min(2600, H * 1.2)), ease = 'cubic-bezier(.55,.06,.25,1)';
    const t0 = 200;
    $('.rod-bot').style.transform = '';
    unrollAnims = [
      hoja.animate([{ clipPath: 'inset(0 0 100% 0)' }, { clipPath: 'inset(0 0 0% 0)' }], { duration: dur, delay: t0, easing: ease, fill: 'both' }),
      $('.rod-bot').animate([{ transform: `translateY(${-H}px)`, opacity: 1 }, { transform: 'none', opacity: 1 }], { duration: dur, delay: t0, easing: ease, fill: 'both' })
    ];
    // Reveal each piece when the unrolling paper reaches it (approximating the easing curve), or later on scroll.
    const frac = y => { const x = Math.min(1, y / H); return Math.pow(x, .62); };
    const top0 = hoja.getBoundingClientRect().top + scrollY;
    const pendientes = new Set();
    piezas.forEach(el => {
      const y = el.getBoundingClientRect().top + scrollY - top0;
      const enPantalla = el.getBoundingClientRect().top < vh * .92;
      if (enPantalla) mostrar(el, t0 + frac(y + 40) * dur * .9 + (el.classList.contains('grow') ? 0 : 150));
      else pendientes.add(el);
    });
    const io = new IntersectionObserver(entries => {
      let i = 0;
      entries.filter(e => e.isIntersecting).forEach(e => { mostrar(e.target, (i++) * 130); io.unobserve(e.target); });
    }, { rootMargin: '0px 0px -12% 0px' });
    setTimeout(() => pendientes.forEach(el => io.observe(el)), t0 + dur * .6);
    setTimeout(() => { introTerminada = true; }, t0 + dur + 600);
    // A tap during the intro skips straight to the end.
    addEventListener('pointerdown', function saltar(ev) {
      if (!introTerminada) { ev.preventDefault(); terminarIntro(); }
      removeEventListener('pointerdown', saltar, true);
    }, true);
  }

  /* ---------- embers ---------- */
  function brasas() {
    if (reducido) return;
    const cv = $('#brasas'), cx = cv.getContext('2d');
    let W, H, dpr, raf = null;
    const N = innerWidth < 600 ? 42 : 66, ps = [];
    const size = () => { dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    const nueva = (inicio) => ({ x: Math.random() * W, y: inicio ? Math.random() * H : H + 10, r: .6 + Math.random() * 1.8, v: .18 + Math.random() * .55, f: Math.random() * 6.28, s: .4 + Math.random() * .9, a: .35 + Math.random() * .6 });
    size(); addEventListener('resize', size);
    for (let i = 0; i < N; i++) ps.push(nueva(true));
    const paso = () => {
      cx.clearRect(0, 0, W, H);
      cx.globalCompositeOperation = 'lighter';
      for (const p of ps) {
        p.y -= p.v; p.f += .012 * p.s; p.x += Math.sin(p.f) * .35;
        if (p.y < -12) Object.assign(p, nueva(false));
        const tw = .6 + .4 * Math.sin(p.f * 3), g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
        g.addColorStop(0, `rgba(255,214,140,${p.a * tw})`); g.addColorStop(.35, `rgba(255,150,60,${p.a * tw * .45})`); g.addColorStop(1, 'rgba(255,120,40,0)');
        cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 6.283); cx.fill();
      }
      raf = requestAnimationFrame(paso);
    };
    const play = () => { if (!raf && !document.hidden) raf = requestAnimationFrame(paso); };
    const stop = () => { if (raf) cancelAnimationFrame(raf); raf = null; };
    document.addEventListener('visibilitychange', () => document.hidden ? stop() : play());
    play();
  }

  // Start once the fonts are in (or after 0.9 s), so the ink reveals never flash a fallback font.
  Promise.race([document.fonts ? document.fonts.ready : Promise.resolve(), new Promise(r => setTimeout(r, 900))])
    .then(() => requestAnimationFrame(() => { intro(); brasas(); }));
</script>
</body>
</html>
